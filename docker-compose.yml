services:
  postgres:
    image: postgres:14
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  s3mock:
    image: adobe/s3mock:latest
    ports:
      - 9090:9090
      - 9191:9191
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://localhost:9090/favicon.ico"]
      interval: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.development
    environment:
      - ENV=${ENV}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=redis_server:6379
      - SESSION_SECRET=${SESSION_SECRET}
      - S3_ENDPOINT=http://s3mock:9090
      - S3_PUBLIC_BASE_URL=http://localhost:9090
      - S3_BUCKET=golang-twitter-uploads
      - S3_REGION=us-east-1
      - S3_ACCESS_KEY=test
      - S3_SECRET_KEY=test
    depends_on:
      - postgres
      - redis_server
      - s3mock
    ports:
      - 8080:8080
    volumes:
      - .:/golang_twitter
      - /golang_twitter/tmp
  redis_server:
    container_name: redis_server
    image: redis:latest
    # 明示的にパスワードなしで起動する設定を追加（安全策）
    command: ["redis-server", "--protected-mode", "no"]
    ports:
      - "16379:6379"

  mail:
    container_name: mail
    image: schickling/mailcatcher
    ports:
      - "1080:1080"
      - "1025:1025"

volumes:
  postgres:

services:
  postgres:
    image: postgres:10.3
    restart: always
    environment:
      - POSTGRES_USER=umeda
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 8080:8080
    volumes:
      - .:/golang_twitter
      - /golang_twitter/tmp

volumes:
  postgres: